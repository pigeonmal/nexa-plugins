name: Nexa Plugins CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-metadata:
    name: License metadata consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check license metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import sys
          from pathlib import Path

          root = Path(".")
          failures = []

          license_text = (root / "LICENSE").read_text()
          if "Mozilla Public License Version 2.0" not in license_text:
              failures.append("LICENSE must be MPL-2.0")
          if "GENERAL PUBLIC LICENSE" in license_text:
              failures.append("LICENSE must not be GPL text")

          readme = (root / "README.md").read_text()
          if "Mozilla Public License 2.0" not in readme:
              failures.append("README license section must say MPL-2.0")
          for forbidden in ("license-MIT", "MIT License", "GPL"):
              if forbidden in readme:
                  failures.append(f"README must not claim {forbidden}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("license metadata consistent (MPL-2.0)")
          EOF

  docs-freshness:
    name: Catalog table matches the manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The catalog table in README.md restates `ios.minVersion` and
      # `android.minSdk` from every plugin.config.nx. Those floors decide what an
      # app must declare -- project generation raises the iOS deployment target
      # to the highest plugin minimum and rejects an app whose `android.minSdk` is
      # below any plugin's -- so a stale column is a wrong answer for whoever
      # reads it. The equivalent table in the parent repository was wrong for 14
      # of 16 packages before it was generated and gated there.
      - name: Check the catalog table
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          from __future__ import annotations

          import re
          import sys
          from pathlib import Path


          def platform_block(manifest: str, platform: str) -> str | None:
              """Return the body of a `platform { ... }` block.

              Braces are matched rather than regex-matched to a closing delimiter, so a
              nested block such as `android { cronet { ... } }` stays inside the platform
              and cannot be mistaken for the platform's own field.
              """
              opening = re.search(rf"\n\s*{platform}\s*\{{", manifest)
              if opening is None:
                  return None
              depth = 1
              index = opening.end()
              while index < len(manifest) and depth > 0:
                  character = manifest[index]
                  if character == "{":
                      depth += 1
                  elif character == "}":
                      depth -= 1
                  index += 1
              return manifest[opening.end() : index - 1]


          def platform_field(manifest: str, platform: str, name: str) -> str | None:
              """Read one numeric field from a platform block, quoted or unquoted."""
              block = platform_block(manifest, platform)
              if block is None:
                  return None
              match = re.search(rf"\b{name}:\s*\"?([0-9.]+)\"?", block)
              return match.group(1) if match else None


          def published_rows(readme: str) -> dict[str, tuple[str, str]]:
              """Parse `| [name](name) | ... | iOS min | Android minSdk | ...` rows."""
              rows: dict[str, tuple[str, str]] = {}
              for line in readme.splitlines():
                  match = re.match(
                      r"\| \[([a-z0-9-]+)\]\(\1\) \|.*?\|\s*([0-9.]+)\s*\|\s*([0-9]+)\s*\|",
                      line,
                  )
                  if match:
                      rows[match.group(1)] = (match.group(2), match.group(3))
              return rows


          def main() -> int:
              root = Path(".")

              packages: dict[str, tuple[str | None, str | None]] = {}
              for manifest_path in sorted(root.glob("*/plugin.config.nx")):
                  manifest = manifest_path.read_text()
                  packages[manifest_path.parent.name] = (
                      platform_field(manifest, "ios", "minVersion"),
                      platform_field(manifest, "android", "minSdk"),
                  )

              if not packages:
                  print("no plugin packages found")
                  return 0

              rows = published_rows((root / "README.md").read_text())
              failures: list[str] = []

              for name, (ios, android) in packages.items():
                  if name not in rows:
                      failures.append(f"{name}: missing a row in the README catalog table")
                      continue
                  published_ios, published_android = rows[name]
                  if published_ios != ios:
                      failures.append(
                          f"{name}: README says iOS min {published_ios}, "
                          f"plugin.config.nx declares {ios}"
                      )
                  if published_android != android:
                      failures.append(
                          f"{name}: README says Android minSdk {published_android}, "
                          f"plugin.config.nx declares {android}"
                      )

              for name in rows:
                  if name not in packages:
                      failures.append(f"{name}: README catalog row has no plugin.config.nx")

              if failures:
                  print("\n".join(failures))
                  return 1

              print(f"catalog table matches {len(packages)} manifests")
              return 0


          if __name__ == "__main__":
              sys.exit(main())
          EOF

  plugin-check:
    name: Plugin manifest and contract check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build the Nexa CLI
        run: |
          git clone --depth 1 https://github.com/pigeonmal/nexa.git "$RUNNER_TEMP/nexa"
          cargo build --manifest-path "$RUNNER_TEMP/nexa/Cargo.toml" -p nexa-cli --locked
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$RUNNER_TEMP/nexa/target/debug/nexa" "$RUNNER_TEMP/bin/nexa"
      - name: Check every plugin package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/bin:$PATH"
          shopt -s nullglob
          manifests=(*/plugin.config.nx)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "no plugin packages found"
            exit 0
          fi
          for manifest in "${manifests[@]}"; do
            package="$(dirname "$manifest")"
            echo "::group::$package"
            nexa plugin check "$package"
            echo "::endgroup::"
          done
